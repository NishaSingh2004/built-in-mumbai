{% extends "admin/base_admin.html" %}
{% block title %}Edit Member{% endblock %}
{% block header %}Edit Member: {{ member.first_name }} {{ member.last_name }}{% endblock %}

{% block content %}
<div class="bg-surface border border-gray-800 rounded-xl p-6 max-w-2xl">
    <form method="POST" class="space-y-6">
        <div class="grid grid-cols-2 gap-6">
            <div>
                <label class="block text-xs font-bold text-gray-500 uppercase mb-2">First Name</label>
                <input type="text" name="first_name" value="{{ member.first_name }}" required class="w-full bg-background border border-gray-800 text-white rounded px-4 py-2 focus:outline-none focus:border-primary">
            </div>
            <div>
                <label class="block text-xs font-bold text-gray-500 uppercase mb-2">Last Name</label>
                <input type="text" name="last_name" value="{{ member.last_name }}" required class="w-full bg-background border border-gray-800 text-white rounded px-4 py-2 focus:outline-none focus:border-primary">
            </div>
        </div>
        
        <div>
            <label class="block text-xs font-bold text-gray-500 uppercase mb-2">Email</label>
            <input type="email" name="email" value="{{ member.email }}" required class="w-full bg-background border border-gray-800 text-white rounded px-4 py-2 focus:outline-none focus:border-primary">
        </div>
        
        <div class="pt-4 flex items-center justify-between">
            <a href="{{ url_for('manage_members') }}" class="text-gray-400 hover:text-white transition">Cancel</a>
            <button type="submit" class="bg-primary hover:bg-primaryHover text-white px-6 py-2 rounded text-sm font-bold transition">Update Member</button>
        </div>
    </form>
</div>
{% endblock %}
