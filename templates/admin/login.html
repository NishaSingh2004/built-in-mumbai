{% extends "admin/base_admin.html" %}
{% block content %}
<div class="h-full flex items-center justify-center">
    <div class="bg-surface border border-gray-800 p-10 rounded-lg shadow-2xl w-full max-w-md">
        <h2 class="text-3xl font-bold text-white mb-2 text-center">Admin Access</h2>
        <p class="text-gray-400 text-sm mb-8 text-center">Enter your credentials to manage the portal.</p>
        
        <form method="POST">
            <div class="mb-5">
                <label class="block text-gray-400 text-xs font-bold mb-2 uppercase">Email Address</label>
                <input  name="email" type="email" required class="w-full bg-background border border-gray-700 text-white rounded px-4 py-3 focus:outline-none focus:border-primary">
            </div>
            <div class="mb-8">
                <label class="block text-gray-400 text-xs font-bold mb-2 uppercase">Password</label>
                <input type="password" name="password" required class="w-full bg-background border border-gray-700 text-white rounded px-4 py-3 focus:outline-none focus:border-primary">
            </div>
            <button type="submit" class="w-full bg-primary hover:bg-primaryHover text-white font-bold py-3 px-4 rounded transition">
                Secure Login
            </button>
        </form>
    </div>
</div>
{% endblock %}
