{% extends "base.html" %}

{% block content %}
<div class="max-w-2xl mx-auto pt-32 pb-20 px-4">
    <h1 class="text-4xl font-bold text-white mb-8">Your Profile</h1>
    
    <div class="bg-surface border border-gray-800 rounded-xl p-8 mb-8">
        <form method="POST" enctype="multipart/form-data" class="space-y-6">
            
            <div class="mb-6 flex items-center space-x-6">
                <div class="shrink-0">
                    {% if member.profile_image_filename %}
                        <img class="h-16 w-16 object-cover rounded-full border border-gray-700" src="{{ url_for('static', filename='uploads/' + member.profile_image_filename) }}" alt="Current profile photo" />
                    {% else %}
                        <div class="h-16 w-16 flex items-center justify-center rounded-full bg-gray-800 border border-gray-700 text-gray-300 font-bold text-xl">
                            {{ member.first_name[:1].upper() }}
                        </div>
                    {% endif %}
                </div>
                <label class="block">
                    <span class="sr-only">Choose profile photo</span>
                    <input type="file" name="profile_image" class="block w-full text-sm text-gray-500
                        file:mr-4 file:py-2 file:px-4
                        file:rounded file:border-0
                        file:text-xs file:font-bold file:uppercase file:tracking-wider
                        file:bg-primary file:text-white
                        hover:file:bg-primaryHover transition
                    "/>
                </label>
            </div>
    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div>
                    <label class="block text-[10px] text-gray-500 font-bold mb-2 uppercase tracking-widest">First Name</label>
                    <input type="text" name="first_name" value="{{ member.first_name }}" required class="w-full bg-background border border-gray-800 text-white rounded px-4 py-3 focus:outline-none focus:border-primary">
                </div>
                <div>
                    <label class="block text-[10px] text-gray-500 font-bold mb-2 uppercase tracking-widest">Last Name</label>
                    <input type="text" name="last_name" value="{{ member.last_name }}" required class="w-full bg-background border border-gray-800 text-white rounded px-4 py-3 focus:outline-none focus:border-primary">
                </div>
            </div>
            
            <div>
                <label class="block text-[10px] text-gray-500 font-bold mb-2 uppercase tracking-widest">Email Address</label>
                <input type="email" name="email" value="{{ member.email }}" required class="w-full bg-background border border-gray-800 text-white rounded px-4 py-3 focus:outline-none focus:border-primary">
            </div>
            
            <div class="pt-6 border-t border-gray-800 text-right">
                <button type="submit" class="px-8 py-3 bg-primary hover:bg-primaryHover text-white rounded text-xs font-bold tracking-wider uppercase transition shadow-lg shadow-primary/20">
                    Save Changes
                </button>
            </div>
        </form>
    </div>

    <div class="bg-red-900/20 border border-red-900/50 rounded-xl p-8">
        <h2 class="text-xl font-bold text-red-500 mb-2">Delete Account</h2>
        <p class="text-sm text-gray-400 mb-6">Once you delete your account, there is no going back. Please be certain.</p>
        <form action="{{ url_for('delete_profile') }}" method="POST" onsubmit="return confirm('Are you sure you want to permanently delete your account?');">
            <button type="submit" class="px-6 py-2 bg-red-600 hover:bg-red-700 text-white rounded text-xs font-bold tracking-wider uppercase transition">
                Delete My Account
            </button>
        </form>
    </div>
</div>
{% endblock %}
