{% extends "base.html" %}

{% block title %}- Join{% endblock %}

{% block content %}
<div class="min-h-[calc(100vh-80px-100px)] flex items-center justify-center py-12 px-4 sm:px-6 lg:px-8 bg-background relative">
    
    <div class="absolute top-8 left-8">
        <h2 class="text-xl font-heading text-white">Mumbai Founders</h2>
    </div>
    
    <div class="absolute top-8 right-8 text-gray-500">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8.228 9c.549-1.165 2.03-2 3.772-2 2.21 0 4 1.343 4 3 0 1.4-1.278 2.575-3.006 2.907-.542.104-.994.54-.994 1.093m0 3h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
    </div>

    <div class="max-w-md w-full border border-gray-800 bg-surface rounded-lg p-8 shadow-2xl relative z-10">
        <div class="mb-8">
            <span class="inline-block border border-gray-700 rounded-full px-3 py-1 text-xs text-gray-400 mb-4">Step 2 of 3</span>
            <h2 class="text-3xl font-heading text-white mb-2">LET'S GET YOU SET UP.</h2>
            <p class="text-sm text-gray-400">
                Create your profile to unlock exclusive community access and builder resources.
            </p>
        </div>

        <form method="POST" action="{{ url_for('public_signup') }}" class="space-y-5">
            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs font-medium text-gray-400 mb-1">First Name</label>
                    <input type="text" name="first_name" required
                        class="w-full bg-transparent border border-gray-700 rounded py-2 px-3 text-white focus:outline-none focus:border-primary transition text-sm">
                </div>
                <div>
                    <label class="block text-xs font-medium text-gray-400 mb-1">Last Name</label>
                    <input type="text" name="last_name" required
                        class="w-full bg-transparent border border-gray-700 rounded py-2 px-3 text-white focus:outline-none focus:border-primary transition text-sm">
                </div>
            </div>

            <div>
                <label class="block text-xs font-medium text-gray-400 mb-1">Email Address</label>
                <input type="email" name="email" required
                    class="w-full bg-transparent border border-gray-700 rounded py-2 px-3 text-white focus:outline-none focus:border-primary transition text-sm">
            </div>

            <div>
                <label class="block text-xs font-medium text-gray-400 mb-1">Password</label>
                <div class="relative">
                    <input type="password" name="password" required
                        class="w-full bg-transparent border border-gray-700 rounded py-2 px-3 text-white focus:outline-none focus:border-primary transition text-sm pr-10">
                    <button type="button" class="absolute right-3 top-2 text-gray-500 hover:text-white">
                        <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
                        </svg>
                    </button>
                </div>
            </div>

            <div>
                <label class="block text-xs font-medium text-gray-400 mb-1">Confirm Password</label>
                <input type="password" name="confirm_password" required
                    class="w-full bg-transparent border border-gray-700 rounded py-2 px-3 text-white focus:outline-none focus:border-primary transition text-sm">
            </div>

            <div class="pt-2">
                <button type="submit" class="w-full bg-primary hover:bg-primaryHover text-white text-xs font-bold uppercase tracking-wider py-3 px-4 rounded transition">
                    CREATE ACCOUNT
                </button>
            </div>
        </form>

        <div class="mt-6">
            <div class="relative">
                <div class="absolute inset-0 flex items-center">
                    <div class="w-full border-t border-gray-800"></div>
                </div>
                <div class="relative flex justify-center text-xs">
                    <span class="px-2 bg-surface text-gray-600 uppercase">OR CONTINUE WITH</span>
                </div>
            </div>

            <div class="mt-4 space-y-3">
                <button class="w-full inline-flex justify-center items-center py-2 px-4 border border-gray-700 rounded text-xs font-bold text-gray-300 hover:bg-gray-800 transition">
                    <svg class="h-4 w-4 mr-2" fill="currentColor" viewBox="0 0 24 24">
                        <path d="M12.48 10.92v3.28h7.84c-.24 1.84-.853 3.187-1.787 4.133-1.147 1.147-2.933 2.4-6.053 2.4-4.827 0-8.6-3.893-8.6-8.72s3.773-8.72 8.6-8.72c2.6 0 4.507 1.027 5.907 2.347l2.307-2.307C18.747 1.44 16.133 0 12.48 0 5.867 0 .307 5.387.307 12s5.56 12 12.173 12c3.573 0 6.267-1.173 8.373-3.36 2.16-2.16 2.84-5.213 2.84-7.667 0-.76-.053-1.467-.173-2.053H12.48z" />
                    </svg>
                    GOOGLE
                </button>
                <button class="w-full inline-flex justify-center items-center py-2 px-4 border border-gray-700 rounded text-xs font-bold text-gray-300 hover:bg-gray-800 transition">
                    <svg class="h-4 w-4 mr-2" fill="currentColor" viewBox="0 0 24 24">
                        <path fill-rule="evenodd" d="M19 0h-14c-2.761 0-5 2.239-5 5v14c0 2.761 2.239 5 5 5h14c2.762 0 5-2.239 5-5v-14c0-2.761-2.238-5-5-5zm-11 19h-3v-11h3v11zm-1.5-12.268c-.966 0-1.75-.79-1.75-1.764s.784-1.764 1.75-1.764 1.75.79 1.75 1.764-.783 1.764-1.75 1.764zm13.5 12.268h-3v-5.604c0-3.368-4-3.113-4 0v5.604h-3v-11h3v1.765c1.396-2.586 7-2.777 7 2.476v6.759z" clip-rule="evenodd" />
                    </svg>
                    LINKEDIN
                </button>
            </div>
        </div>

        <div class="mt-6 text-center">
            <a href="{{ url_for('public_login') }}" class="text-xs text-gray-400 hover:text-white transition">
                Already have an account? <span class="font-bold underline">Log in</span>
            </a>
        </div>
    </div>
</div>
{% endblock %}
