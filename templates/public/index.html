<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Build in Mumbai - Welcome</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        background: '#0B0E14',
                        surface: '#151A23',
                        primary: '#7C3AED',
                        primaryHover: '#6D28D9',
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        heading: ['Clash Display', 'sans-serif']
                    }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { background-color: #0B0E14; color: #FFFFFF; font-family: 'Inter', sans-serif; }
        h1, h2, .font-heading { font-family: 'Clash Display', 'Inter', sans-serif; font-weight: 700; }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center relative overflow-hidden bg-background">
    <!-- Decorative background elements -->
    <div class="absolute top-0 left-0 w-[500px] h-[500px] bg-primary/10 rounded-full blur-[100px] -translate-x-1/2 -translate-y-1/2 pointer-events-none"></div>
    <div class="absolute bottom-0 right-0 w-[600px] h-[600px] bg-primary/5 rounded-full blur-[120px] translate-x-1/3 translate-y-1/3 pointer-events-none"></div>
    
    <div class="relative max-w-4xl mx-auto px-4 sm:px-6 lg:px-8 text-center z-10 w-full">
        <h2 class="text-6xl md:text-8xl font-heading tracking-tight text-white mb-8 leading-none">
            YOUR PEOPLE<br>ARE OUT THERE.
        </h2>
        <p class="text-lg md:text-xl text-gray-400 mb-12 max-w-2xl mx-auto leading-relaxed">
            Join a community of founders, creators, students, freelancers, mentors, investors and innovators building what's next in Mumbai. No cliches. Just builders.
        </p>
        <div class="flex flex-col sm:flex-row justify-center items-center gap-6">
            <a href="{{ url_for('public_signup') }}" class="bg-primary hover:bg-primaryHover text-white px-10 py-4 rounded text-sm font-bold uppercase tracking-widest transition w-full sm:w-auto text-center shadow-lg shadow-primary/20">
                LET'S BUILD &rarr;
            </a>
            <a href="{{ url_for('public_login') }}" class="border border-gray-600 text-white hover:bg-gray-800 px-10 py-4 rounded text-sm font-bold uppercase tracking-widest transition w-full sm:w-auto text-center">
                ALREADY A MEMBER? LOG IN
            </a>
        </div>
    </div>
</body>
</html>
