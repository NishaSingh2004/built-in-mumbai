{% extends "base.html" %}

{% block title %}- Success{% endblock %}

{% block content %}
<div class="min-h-[calc(100vh-80px-100px)] flex items-center justify-center bg-background relative overflow-hidden">
    <!-- Diagonal lines background effect -->
    <svg class="absolute inset-0 w-full h-full text-gray-800/20" pointer-events="none">
        <line x1="0" y1="20%" x2="100%" y2="40%" stroke="currentColor" stroke-width="1" />
        <line x1="0" y1="40%" x2="100%" y2="60%" stroke="currentColor" stroke-width="1" />
        <line x1="0" y1="60%" x2="100%" y2="80%" stroke="currentColor" stroke-width="1" />
    </svg>

    <div class="text-center z-10 relative">
        <!-- Glow effect behind the checkmark -->
        <div class="absolute top-1/4 left-1/2 -translate-x-1/2 w-32 h-32 bg-emerald-500/20 rounded-full blur-2xl"></div>
        
        <div class="mb-8 flex justify-center relative">
            <div class="w-16 h-16 bg-surface border border-gray-700 rounded-xl flex items-center justify-center shadow-lg">
                <svg class="w-8 h-8 text-emerald-400" fill="currentColor" viewBox="0 0 20 20">
                    <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd" />
                </svg>
            </div>
        </div>

        <h1 class="text-5xl font-heading tracking-tight text-white mb-4">
            WELCOME BACK, {{ session.get('member_name', 'BUILDER') | upper }}.
        </h1>
        <p class="text-gray-400 mb-8">
            Let's get you back into the community.
        </p>
        
        <a href="{{ url_for('public_home') }}" class="text-xs font-bold text-gray-400 hover:text-white uppercase tracking-widest transition">
            BACK TO HOME
        </a>
    </div>
</div>
{% endblock %}
