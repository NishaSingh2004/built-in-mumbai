services:
  - type: web
    name: build-in-mumbai
    env: python
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python init_db.py && gunicorn app:app"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: build-in-mumbai-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true

databases:
  - name: build-in-mumbai-db
